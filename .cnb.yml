# NPC 流水线：Issue/PR 评论 @ 助手时触发
# 工程师 NPC 运行环境使用仓库自建镜像（含 Java 11 / Gradle 工具链，Dockerfile 见 .cnb/npc/Dockerfile），
# 镜像由 main.push 事件下的 npc-runtime-image 流水线自动构建并推送（tag: npc-java），
# 与项目自身的 Java 部署 Dockerfile 互不影响。
.npc_task: &npc_task
  - docker:
      # CNB_NPC_SLUG_LOWERCASE：NPC 所属仓库（sailwertech/inquisition）的小写 slug
      image: ${CNB_DOCKER_REGISTRY}/${CNB_NPC_SLUG_LOWERCASE}:npc-java
    stages:
      - name: npc go
        type: npc:go

# NPC 运行环境镜像构建：.cnb/npc/** 变更推送 main 时自动重建并推送
main:
  push:
    npc-runtime-image:
      name: build-npc-runtime-image
      services:
        - docker
      ifModify:
        - .cnb/npc/**
      stages:
        - name: docker build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:npc-java -f .cnb/npc/Dockerfile .
        - name: docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:npc-java

    # 应用镜像构建与推送：每次 push 到 main 都触发（不加 ifModify，保证每次更新都打包上传）
    # 复用 npc-java 基座（含 Gradle 工具链），DinD 构建并推送应用镜像
    build-and-push-app-image:
      name: build-and-push-app-image
      docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:npc-java
      services:
        - docker
      stages:
        - name: gradle build
          script: ./gradlew --no-daemon bootJar
        - name: docker build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT} -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
        - name: docker push
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

$:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task
