server:
  port: 2000 # 端口
  ssl:
    key-store: ${SSL_KEY_STORE:}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    enabled: false

spring:
  # 数据库配置（缩进严格为2个空格）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inquisition}?useSSL=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
  mail:
    enable: ${MAIL_ENABLE:false}
    enabled: ${MAIL_ENABLE:false}
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    protocol: smtps
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    to: ${MAIL_TO:}
    nickname: ${MAIL_NICKNAME:阿戈尔科技}
  output:
    ansi:
      enabled: always

mybatis:
  table:
    auto: update
    #create      系统启动后，会将所有的表删除掉，然后根据model中配置的结构重新建表，该操作会破坏原有数据。
    #update      系统会自动判断哪些表是新建的，哪些字段要修改类型等，哪些字段要删除，哪些字段要新增，该操作不会破坏原有数据。
    #none       系统不做任何处理。
    #add        新增表/新增字段/新增索引/新增唯一约束的功能，不做做修改和删除
  model:
    pack: moe.dazecake.inquisition.model.entity
  database:
    type: mysql

mybatis-plus:
  mapper-locations: classpath*:com/gitee/sunchenbin/mybatis/actable/mapping/*/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# wxpusher配置
wx-pusher:
  enable: ${WXPUSHER_ENABLE:false}
  app-token: ${WXPUSHER_APP_TOKEN:}

# qmsg配置 - QQ消息推送
qmsg:
  enable: ${QMSG_ENABLE:true}
  key: ${QMSG_KEY:}

# 存储配置 用于存储日志截图 需要自行配置删除规则
storage:
  oss:
    #腾讯云COS
    enable: ${OSS_ENABLE:false}
    secretId: ${OSS_SECRET_ID:}
    secretKey: ${OSS_SECRET_KEY:}
    bucket: ${OSS_BUCKET:}
    region: ${OSS_REGION:}
  chfs:
    enable: ${CHFS_ENABLE:false}
    url: ${CHFS_URL:}
    username: ${CHFS_USERNAME:}
    password: ${CHFS_PASSWORD:}
    uploadDir: ${CHFS_UPLOAD_DIR:/inquisition/log/img}
  qiniu:
    enable: ${QINIU_ENABLE:false}
    accessKey: ${QINIU_ACCESS_KEY:}
    secretKey: ${QINIU_SECRET_KEY:}
    bucket: ${QINIU_BUCKET:}
    domain: ${QINIU_DOMAIN:}

inquisition:
  # JWT密钥：必须配置不少于32字符的随机字符串，否则启动时将拒绝启动
  secret: ${INQUISITION_SECRET:}
  # 开发模式：生产环境必须为false
  dev_mode: ${INQUISITION_DEV_MODE:false}
  # CORS 跨域配置
  cors:
    # 总开关：false=完全禁用跨域（仅同源访问），true=启用
    enabled: ${INQUISITION_CORS_ENABLED:true}
    # 白名单：逗号分隔的合法前端域名
    #   填 *       = 允许所有来源（仅建议本地调试）
    #   填具体域名 = 白名单模式
    #   留空       = 仅允许同源访问
    allowed-origins: ${INQUISITION_CORS_ORIGINS:}
  # 每日价格
  price:
    daily: ${INQUISITION_PRICE_DAILY:1.0}
  # 初始管理员账号（仅首次初始化、admin 表为空时生效）
  admin:
    # 账号名，默认 root
    init-username: ${INQUISITION_ADMIN_INIT_USERNAME:root}
    # 密码：配置后不会输出到日志；留空则随机生成并打印到日志
    init-password: ${INQUISITION_ADMIN_INIT_PASSWORD:}
  # 日志定时清理配置
  log:
    clean:
      # 是否启用日志定时清理
      # 该操作为不可逆的物理删除，默认关闭，需确认留存合规要求后显式开启
      enabled: ${INQUISITION_LOG_CLEAN_ENABLED:false}
      # 日志保留天数，必须大于 0，早于该天数的日志将被物理删除
      # 配置为 0 或负数时清理任务跳过执行，避免误删整表
      retention-days: ${INQUISITION_LOG_RETENTION_DAYS:30}
      # 清理执行周期（cron 表达式），默认每天凌晨 3 点
      # 留空或非法时回退为默认值并记录警告
      cron: ${INQUISITION_LOG_CLEAN_CRON:0 0 3 * * ?}
      # 单批删除条数，分批执行以避免长事务锁表
      batch-size: ${INQUISITION_LOG_CLEAN_BATCH_SIZE:1000}
      # 单轮最多执行的批次数，剩余部分留待下一轮
      # 避免长时间独占调度线程而阻塞其它高频定时任务
      max-batches: ${INQUISITION_LOG_CLEAN_MAX_BATCHES:20}

